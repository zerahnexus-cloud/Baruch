
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | EcoHub</title>

<style>

/* =========================================================
   ECOHUB CONTACT PAGE
   Minimal • Classic • Responsive
========================================================= */

:root{
  --navy:#0c0a85;
  --deep:#101642;
  --gold:#d89b3d;
  --gold-light:#f1c875;
  --cream:#f7f6f1;
  --white:#ffffff;
  --text:#17202b;
  --muted:#667085;

  --shadow:
    0 18px 45px rgba(10,20,40,.08);
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  display:flex;
  flex-direction:column;

  font-family:
    "Segoe UI",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(216,155,61,.10),
      transparent 35%
    ),
    var(--cream);

  line-height:1.7;
}

a{
  color:inherit;
}


/* =========================================================
   HOME BUTTON
========================================================= */

.home-button{
  position:fixed;

  top:24px;
  left:24px;

  z-index:20;

  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:10px 16px;

  border:1px solid rgba(12,10,133,.12);
  border-radius:999px;

  background:rgba(255,255,255,.78);

  color:var(--deep);

  text-decoration:none;

  font-size:.85rem;
  font-weight:700;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  box-shadow:0 8px 25px rgba(10,20,40,.07);

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.home-button:hover{
  color:var(--deep);

  background:#fff;

  transform:translateY(-2px);

  box-shadow:
    0 12px 28px rgba(10,20,40,.10),
    0 0 22px rgba(216,155,61,.16);
}

.home-icon{
  font-size:1rem;
  line-height:1;
}


/* =========================================================
   MAIN
========================================================= */

.contact-page{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    100px
    20px
    80px;
}


/* =========================================================
   CONTACT CARD
========================================================= */

.contact-card{
  width:min(720px,100%);

  padding:
    clamp(40px,7vw,70px)
    clamp(25px,6vw,65px);

  text-align:center;

  background:rgba(255,255,255,.92);

  border:1px solid rgba(12,10,133,.07);

  border-radius:24px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}


/* =========================================================
   LOGO
========================================================= */

.contact-logo{
  width:clamp(105px,18vw,145px);

  height:auto;

  margin:0 auto 30px;
}


/* =========================================================
   HEADING
========================================================= */

.contact-label{
  display:block;

  margin-bottom:10px;

  color:var(--gold);

  font-size:.74rem;

  font-weight:800;

  letter-spacing:2.5px;

  text-transform:uppercase;
}

.contact-card h1{
  margin-bottom:15px;

  color:var(--deep);

  font-size:clamp(2rem,5vw,3rem);

  line-height:1.15;

  letter-spacing:-.8px;
}

.contact-intro{
  max-width:560px;

  margin:
    0
    auto
    42px;

  color:var(--muted);

  font-size:1rem;

  line-height:1.8;
}


/* =========================================================
   CONTACT DETAILS
========================================================= */

.contact-details{
  display:flex;

  flex-direction:column;

  gap:16px;

  max-width:470px;

  margin:0 auto 35px;
}

.contact-item{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  padding:15px 20px;

  background:#f8f8f6;

  border:1px solid rgba(12,10,133,.06);

  border-radius:14px;

  color:var(--text);

  text-decoration:none;

  font-size:.96rem;

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.contact-item:hover{
  color:var(--deep);

  background:#fff;

  transform:translateY(-2px);

  box-shadow:
    0 10px 25px rgba(10,20,40,.07),
    0 0 22px rgba(216,155,61,.12);
}

.contact-icon{
  width:30px;

  font-size:1.15rem;

  color:var(--gold);
}


/* =========================================================
   WHATSAPP BUTTON
========================================================= */

.whatsapp-button{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  padding:13px 26px;

  border-radius:999px;

  background:#25D366;

  color:#fff;

  text-decoration:none;

  font-size:.95rem;

  font-weight:700;

  box-shadow:
    0 10px 25px rgba(37,211,102,.20);

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.whatsapp-button:hover{
  color:#fff;

  background:#1fbd59;

  transform:translateY(-3px);

  box-shadow:
    0 14px 30px rgba(37,211,102,.25);
}

.whatsapp-icon{
  font-size:1.1rem;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
  padding:20px 15px;

  background:var(--deep);

  color:#cbd1df;

  text-align:center;

  font-size:.82rem;

  letter-spacing:.25px;
}

footer strong{
  color:#fff;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .home-button{
    top:16px;
    left:16px;

    padding:9px 13px;

    font-size:.8rem;
  }

  .contact-page{
    padding:
      90px
      16px
      55px;
  }

  .contact-card{
    border-radius:20px;
  }

  .contact-intro{
    margin-bottom:32px;
  }

  .contact-item{
    flex-wrap:wrap;

    padding:14px 15px;

    font-size:.9rem;
  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  html{
    scroll-behavior:auto;
  }

  *,
  *::before,
  *::after{
    transition-duration:.01ms !important;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     HOME BUTTON
======================================================= -->

<a
  href="index.html"
  class="home-button"
  aria-label="Return to EcoHub home"
>
  <span class="home-icon">⌂</span>
  <span>Home</span>
</a>


<!-- =======================================================
     CONTACT
======================================================= -->

<main class="contact-page">

  <section class="contact-card">

    <img
      src="imgs/Zerah Nexus logo.png"
      alt="EcoHub Logo"
      class="contact-logo"
    >


    <span class="contact-label">
      Get in Touch
    </span>


    <h1>
      Contact EcoHub
    </h1>


    <p class="contact-intro">
      Have a project, partnership or service enquiry?
      We would be glad to hear from you.
    </p>


    <!-- CONTACT DETAILS -->

    <div class="contact-details">


      <!-- PHONE -->

      <a
        href="tel:+254742082219"
        class="contact-item"
      >
        <span class="contact-icon">☎</span>

        <span>
          +254 742 082 219
        </span>
      </a>


      <a
        href="tel:+254103775239"
        class="contact-item"
      >
        <span class="contact-icon">☎</span>

        <span>
          +254 103 775 239
        </span>
      </a>


      <!-- EMAIL -->

      <a
        href="mailto:info@ecosolutionhub.com"
        class="contact-item"
      >
        <span class="contact-icon">✉</span>

        <span>
          zerahnexus@gmail.com
        </span>
      </a>


    </div>


    <!-- WHATSAPP -->

    <a
      href="https://wa.me/254742082219"
      target="_blank"
      rel="noopener noreferrer"
      class="whatsapp-button"
    >

      <span class="whatsapp-icon">
        ◉
      </span>

      Chat with us on WhatsApp

    </a>


  </section>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer>

  © 2026
  <strong>EcoHub</strong>.
  All rights reserved.

</footer>


</body>
</html>
